<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt · ครอบครัว</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{font:15px system-ui;background:#f3f6f9;color:#23364a;margin:0}header{padding:20px 5%;background:#173d35;color:white;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}header small{color:#b7d8c8}main{max-width:1350px;margin:auto;padding:28px 20px}button,input,select{font:inherit;border:1px solid #d7e1e5;border-radius:8px;padding:10px}button{cursor:pointer;background:#edf5f1;color:#176b50}button:disabled{opacity:.5;cursor:wait}header button,#save{background:#277b5f;color:white;border:0}.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:end;background:white;padding:20px;border-radius:14px}label{display:flex;flex-direction:column;gap:6px;font-size:13px}#total{background:#e3f2eb;border:1px solid #cbe4d7;border-radius:14px;padding:25px;margin:20px 0;font-size:25px;font-weight:700}table{border-collapse:collapse;width:100%;background:white}th{background:#e9eff5;font-size:13px;white-space:nowrap}td,th{text-align:left;padding:15px;border-bottom:1px solid #e6edf0}tbody tr:nth-child(even){background:#f9fbfc}td small{display:block;color:#738494;margin-top:5px}.badge{padding:6px 10px;border-radius:15px;background:#fff1d8;color:#8a641c;white-space:nowrap}.badge.ok{background:#dbf2e6;color:#1b6d48}.actions{white-space:nowrap}.danger{color:#b33c3c;background:#fff0ef;margin-left:6px}#error,#dialogError{color:#b33c3c}#info{color:#728395;font-size:13px}dialog{border:0;border-radius:16px;padding:28px;width:min(700px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#152d4599}#formFields{display:grid;grid-template-columns:1fr 1fr;gap:15px}dialog footer{display:flex;justify-content:end;gap:12px;margin-top:22px}@media(max-width:600px){header{align-items:start;gap:12px}h1{font-size:20px}#formFields{grid-template-columns:1fr}.filters label{flex:1 1 130px}}th button{background:transparent;border:0;padding:0;color:inherit;font-weight:bold;white-space:nowrap}th[aria-sort]{background:#d3e8df}.note{min-width:180px;max-width:320px;white-space:normal;overflow-wrap:anywhere}.drive-link{margin-left:auto;display:inline-flex;align-items:center;padding:10px 14px;border:1px solid #cbe0d4;border-radius:8px;background:#edf5f1;color:#176b50;text-decoration:none;white-space:nowrap}.drive-link:hover{background:#dceee3}.drive-link:focus-visible{outline:3px solid #277b5f;outline-offset:3px}</style></head><body><header><div><h1>Receipt</h1><small>ค่าใช้จ่ายครอบครัว</small></div><div><button id="login">เข้าสู่ระบบ Google</button><button id="logout" hidden>ออกจากระบบ</button></div></header><main><div class="filters"><label>สถานะ<select id="status"><option value="">ทั้งหมด</option><option>ยืนยันแล้ว</option><option>รอตรวจสอบ</option></select></label><label>ตั้งแต่<input type="date" id="start"></label><label>ถึง<input type="date" id="end"></label><button id="refresh" disabled>↻ Refresh จาก Sheet</button><a class="drive-link" href="https://docs.google.com/spreadsheets/d/1SIdh88ALERIOyhjJou4sCzCFd8g5KbKv08xAEBt_Two/edit" target="_blank" rel="noopener noreferrer">↗ เปิด Google Sheet</a></div><p id="info"></p><p id="error" role="alert"></p><div id="total"></div><div style="overflow:auto;border-radius:12px"><table><thead><tr></tr></thead><tbody id="rows"></tbody></table></div><p id="infoNote">จำนวนและหน่วยที่ยังไม่มีใน Sheet แสดงเป็น — • รายการชั่งน้ำหนักแสดงหน่วย กก.</p></main><dialog id="editor"><form id="editForm"><h2>✎ แก้ไขรายการ</h2><p>บันทึกกลับ Google Sheet โดยตรง</p><div id="formFields"></div><p id="dialogError" role="alert"></p><footer><button type="button" id="cancel">ยกเลิก</button><button type="submit" id="save">บันทึก</button></footer></form></dialog><script src="config.js?v=20261028-5"></script><script src="app.js?v=20261028-5"></script><script src="https://
